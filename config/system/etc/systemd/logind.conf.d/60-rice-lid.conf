# Closing the lid on external power locks the session instead of suspending it.
# HandleLidSwitch keeps its default, so the lid still suspends on battery, and
# HandleLidSwitchDocked=ignore still wins while an external display is connected.
# Installed by rice phase 50-thinkpad when SUSPEND_ON_AC=false.
[Login]
HandleLidSwitchExternalPower=lock
