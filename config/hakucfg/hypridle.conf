# Idle timeout overrides for hypridle.
#
# This file must sit at the root of ~/hakucfg, not in ~/hakucfg/config. Upstream's
# ~/.config/hypr/hypridle.conf ends its variable block with
#   source = ~/hakucfg/hypridle.con*
# while check_control_dir creates its template one level deeper, at
# ~/hakucfg/config/hypridle.conf, which that glob never matches. Editing the file
# upstream points you at therefore has no effect. This one resolves, and because
# upstream never creates it, no update overwrites it.
#
# The shipped defaults suit a desktop, not a laptop that compiles: they dim at two
# minutes, lock at two and a half, blank at three and suspend at five, on AC as well
# as on battery. A long test run or container build with no keyboard input would be
# suspended out from under you.

$timeout_dim = 600
$timeout_lock = 900
$timeout_dpms = 1200
$timeout_suspend = 3600
