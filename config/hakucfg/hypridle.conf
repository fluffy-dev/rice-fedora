# Idle timeouts and the idle suspend policy for hypridle.
#
# This file must sit at the root of ~/hakucfg, not in ~/hakucfg/config. Upstream's
# ~/.config/hypr/hypridle.conf declares fallback timeouts and then, above all of
# its listeners, runs
#   source = ~/hakucfg/hypridle.con*
# while check_control_dir creates its template one level deeper, at
# ~/hakucfg/config/hypridle.conf, which that glob never matches. This one resolves,
# and because upstream never creates it, no update overwrites it. Every file the
# glob matches is parsed in sorted order, so never leave a backup beside it.
#
# Upstream's defaults suit a desktop, not a laptop that compiles: they dim at two
# minutes, lock at two and a half, blank at three and suspend at five, on AC as
# well as on battery.
#
# Phase 50 deploys this file as it stands when SUSPEND_ON_AC=false. A suspend
# timeout of -1 makes hypridle discard upstream's suspend listener, and the
# listener below suspends only when systemd-ac-power reports no external power,
# which is the same test logind uses for the lid. A huge timeout is no substitute:
# hypridle hands it to the compositor in milliseconds through a 32-bit field, so
# anything above 4294967 seconds wraps to a short one. With SUSPEND_ON_AC=true the
# phase deletes both AC tests, which leaves a listener identical to upstream's.

$timeout_dim = 600
$timeout_lock = 900
$timeout_dpms = 1200
$timeout_suspend = -1

# Suspend after an hour idle, on battery only.
#
# condition_cmd needs hypridle 0.1.8. While it fails, hypridle runs it again every
# retry interval until input resumes, so a machine unplugged while already idle
# still suspends, and idle_inhibit.sh keeps upstream's audio and manual inhibit.
# The test in on-timeout repeats the AC check for a hypridle that ignores
# condition_cmd.
listener {
    timeout = 3600
    on-timeout = /usr/bin/systemd-ac-power || systemctl suspend
    condition_cmd = ! /usr/bin/systemd-ac-power && ~/.local/bin/idle_inhibit.sh
    condition_retry = $condition_retry_timeout
}
