name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Parse and shellcheck every script
        run: ./lint.sh

      - name: Reject em and en dashes
        run: |
          if grep -rnIP '[\x{2013}\x{2014}]' --exclude-dir=.git .; then
            echo "use a plain hyphen instead"
            exit 1
          fi
