name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the scripts are checked with locally. The runner image's
      # own shellcheck is older and reports warnings that version never raises.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Parse and shellcheck every script
        run: ./lint.sh

      - name: Reject em and en dashes
        run: |
          if grep -rnIP '[\x{2013}\x{2014}]' --exclude-dir=.git .; then
            echo "use a plain hyphen instead"
            exit 1
          fi
